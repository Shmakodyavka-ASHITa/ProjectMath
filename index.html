<body>
<div class="sym"><span style="left:6%;animation-delay:0s">π</span><span style="left:22%;animation-delay:-5s">∑</span><span style="left:40%;animation-delay:-9s">√</span><span style="left:58%;animation-delay:-2s">∠</span><span style="left:76%;animation-delay:-12s">sin</span><span style="left:90%;animation-delay:-7s">∞</span></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ============================================================
   1. CONSTANTS
   ============================================================ */
const SHARE_URL   = 'https://claude.ai/artifact/GN2AffXrf3HuQcnZR2nAr5';
const PI          = 3.14;
const SESSION_KEY = 'mt_session';
const SCORES_KEY  = 'mt_scores';
const ROUND_SIZE  = 10;
const TIME_PER_Q  = 25;

/* ============================================================
   2. UTILITIES
   ============================================================ */
const $   = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const rand    = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick    = (arr)  => arr[rand(0, arr.length - 1)];
const shuffle = (arr)  => arr
  .map(x => [Math.random(), x])
  .sort((p, q) => p[0] - q[0])
  .map(x => x[1]);

const fmtNum = (n) =>
  String(+Number(n).toFixed(2)).replace('.', ',').replace('-', '−');

const gcd = (a, b) => b ? gcd(b, a % b) : a;
const frac = (n, d) => {
  const g = gcd(Math.abs(n), Math.abs(d)) || 1;
  n /= g; d /= g;
  if (d < 0) { n = -n; d = -d; }
  return (d === 1 ? String(n) : `${n}/${d}`).replace('-', '−');
};

const LS = {
  get(key, fallback) {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      return v == null ? fallback : v;
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
};

/* ============================================================
   3. STORAGE (local + optional shared)
   ============================================================ */
let db     = null;
let mode   = 'local';   // 'local' | 'shared'
let me     = null;
let board  = [];
let unsub  = null;

async function sha(text) {
  try {
    const buf = await crypto.subtle.digest(
      'SHA-256', new TextEncoder().encode('mt|' + text)
    );
    return [...new Uint8Array(buf)]
      .map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    return btoa(unescape(encodeURIComponent('mt|' + text)));
  }
}

async function getUser(id) {
  if (db) {
    try {
      const snap = await db.collection('scores').doc(id).get();
      if (snap.exists) return snap.data();
    } catch (e) {
      db = null; mode = 'local';
    }
  }
  return LS.get(SCORES_KEY, {})[id] || null;
}

async function putUser(user) {
  const all = LS.get(SCORES_KEY, {});
  all[user.id] = user;
  LS.set(SCORES_KEY, all);
  if (db) {
    try {
      await db.collection('scores').doc(user.id).set(user);
    } catch (e) {
      db = null; mode = 'local';
    }
  }
}

function startBoard() {
  if (unsub) unsub();
  const localUsers = () => Object.values(LS.get(SCORES_KEY, {}));
  if (db) {
    try {
      unsub = db.collection('scores').onSnapshot(
        snap => { board = snap.docs.map(d => d.data()); refresh(); },
        ()   => { board = localUsers(); refresh(); }
      );
      return;
    } catch (e) { /* fall through */ }
  }
  board = localUsers();
  refresh();
}

function refresh() {
  if (screen === 'home' || screen === 'board') go(screen);
}

/* ============================================================
   4. QUESTION SYSTEM
   ============================================================ */

/**
 * Creates a multiple-choice question.
 * @param {string}             text        – условие
 * @param {string|number}      answer      – правильный ответ
 * @param {Array<string|number>} distractors – неверные варианты
 * @param {string}             explanation – пояснение после ответа
 */
function makeQuestion(text, answer, distractors, explanation) {
  const numeric   = typeof answer === 'number';
  const format    = numeric ? fmtNum : String;
  const answerStr = format(answer);
  const seen      = new Set([answerStr]);
  const opts      = [];

  for (const d of distractors || []) {
    const v = format(d);
    if (!seen.has(v)) { seen.add(v); opts.push(v); }
  }

  // Добиваем числовые дистракторы близкими значениями
  for (let i = 0; numeric && opts.length < 3 && i < 80; i++) {
    const step = Math.max(1, Math.round(Math.abs(answer) / 10));
    const x = answer + pick([-1, 1]) * rand(1, 5) * step;
    if (answer > 0 && x <= 0) continue;
    const v = format(x);
    if (!seen.has(v)) { seen.add(v); opts.push(v); }
  }

  return {
    text,
    answer: answerStr,
    options: shuffle([answerStr, ...opts.slice(0, 3)]),
    explanation
  };
}

/* ---------- 4.1 Тригонометрия ---------- */
const TRIG_TABLE = {
  sin: { 30: '1/2',   45: '√2/2', 60: '√3/2' },
  cos: { 30: '√3/2',  45: '√2/2', 60: '1/2'  },
  tg:  { 30: '√3/3',  45: '1',    60: '√3'   }
};
const TRIG_VALUES   = ['1/2', '√2/2', '√3/2', '√3/3', '1', '√3'];
const PYTHAGOREAN   = [[3,4,5], [5,12,13], [8,15,17]];

function trigTable() {
  const angle  = pick([30, 45, 60]);
  const fn     = pick(['sin', 'cos', 'tg']);
  const answer = TRIG_TABLE[fn][angle];
  return makeQuestion(
    `Чему равен ${fn} ${angle}°?`,
    answer,
    shuffle(TRIG_VALUES.filter(v => v !== answer)).slice(0, 3),
    `Табличное значение: ${fn} ${angle}° = ${answer}.`
  );
}

function trigRightTriangle(level) {
  const [a, b, c] = pick(PYTHAGOREAN);
  const k  = level > 1 ? rand(2, 4) : 1;
  const fn = pick(['sin', 'cos', 'tg']);
  const answer = { sin: frac(a, c), cos: frac(b, c), tg: frac(a, b) }[fn];
  return makeQuestion(
    `В прямоугольном треугольнике катеты ${a*k} и ${b*k}. ` +
    `Найди ${fn} угла α, лежащего напротив катета ${a*k}.`,
    answer,
    [frac(b,c), frac(a,b), frac(b,a), frac(c,a)]
      .filter(x => x !== answer).slice(0, 3),
    `Гипотенуза = ${c*k}. sin = противолежащий/гипотенуза, ` +
    `cos = прилежащий/гипотенуза, tg = противолежащий/прилежащий. Ответ: ${answer}.`
  );
}

function trigRadians() {
  const pairs = [
    ['π/6', 30], ['π/4', 45], ['π/3', 60], ['π/2', 90],
    ['2π/3', 120], ['3π/4', 135], ['5π/6', 150], ['π', 180]
  ];
  const [rad, deg] = pick(pairs);
  const extra = deg === 90 ? 45 : 180 - deg;
  return makeQuestion(
    `Переведи ${rad} радиан в градусы.`,
    deg,
    [deg * 2, deg + 30, extra],
    `π рад = 180°, поэтому ${rad} = ${deg}°.`
  );
}

function trigFromCos() {
  const [a, b, c] = pick(PYTHAGOREAN);
  const answer = frac(a, c);
  return makeQuestion(
    `cos α = ${frac(b, c)}, угол α острый. Найди sin α.`,
    answer,
    [frac(b,c), frac(a,b), frac(c,a)],
    `sin²α + cos²α = 1 → sin α = √(1 − (${b}/${c})²) = ${answer}.`
  );
}

/* ---------- 4.2 Прямые ---------- */
function lineEq(k, b) {
  const kPart = k === 1 ? '' : k === -1 ? '−' : k;
  const bPart = b === 0 ? '' : b > 0 ? ` + ${b}` : ` − ${Math.abs(b)}`;
  return `y = ${kPart}x${bPart}`;
}

function linesParallelAngles() {
  const x = rand(40, 80);
  const [type, answer] = pick([
    ['соответственный', x],
    ['накрест лежащий', x],
    ['односторонний',   180 - x]
  ]);
  const distractors = [180 - x, x + 10, 180 - x + 10].filter(v => v !== answer);
  return makeQuestion(
    `Две параллельные прямые пересечены секущей. ` +
    `Один из углов равен ${x}°. Чему равен ${type} ему угол?`,
    answer,
    distractors,
    `Соответственные и накрест лежащие углы равны, ` +
    `односторонние дают в сумме 180°. Ответ: ${answer}°.`
  );
}

function linesSlope() {
  const k  = pick([-3, -2, -1, 1, 2, 3, 4]);
  const x1 = rand(-3, 2);
  const x2 = x1 + rand(1, 4);
  const y1 = rand(-4, 4);
  const y2 = y1 + k * (x2 - x1);
  return makeQuestion(
    `Найди угловой коэффициент прямой, проходящей через ` +
    `A(${fmtNum(x1)}; ${fmtNum(y1)}) и B(${fmtNum(x2)}; ${fmtNum(y2)}).`,
    k,
    [-k, k + 1, k - 1, k * 2],
    `k = (y₂ − y₁)/(x₂ − x₁) = (${y2 - y1})/(${x2 - x1}) = ${k}.`
  );
}

function linesParallelPerp() {
  if (Math.random() < 0.5) {
    const k = pick([2, 3, 4, 5, -2, -3]);
    const b = rand(-5, 5);
    const answer = frac(-1, k);
    return makeQuestion(
      `Прямая ${lineEq(k, b)} перпендикулярна прямой y = mx + 1. Найди m.`,
      answer,
      [frac(1, k), String(-k), String(k)],
      `Для перпендикулярных прямых k₁·k₂ = −1, ` +
      `значит m = −1/${k} = ${answer}.`
    );
  }
  const k = rand(-5, 5) || 2;
  return makeQuestion(
    `Прямые y = ${fmtNum(k)}x + 3 и y = mx − 5 параллельны. Найди m.`,
    k,
    [-k, k + 1, k - 1],
    `Параллельные прямые имеют равные угловые коэффициенты: ` +
    `m = ${fmtNum(k)}.`
  );
}

function linesIntersection() {
  const x = rand(-4, 4);
  const y = rand(-6, 6);
  let k1 = rand(-3, 3) || 1;
  let k2 = rand(-3, 3) || -2;
  if (k1 === k2) k2 = k1 + 1;
  const b1 = y - k1 * x;
  const b2 = y - k2 * x;
  const pt = (a, b) => `(${fmtNum(a)}; ${fmtNum(b)})`;
  const answer = pt(x, y);
  return makeQuestion(
    `Найди точку пересечения прямых ${lineEq(k1, b1)} и ${lineEq(k2, b2)}.`,
    answer,
    [pt(y, x), pt(-x, y), pt(x, -y), pt(x + 1, y - 1)]
      .filter(v => v !== answer).slice(0, 3),
    `Приравняй правые части: ${k1}x + ${b1} = ${k2}x + ${b2} ` +
    `→ x = ${x}, тогда y = ${y}.`
  );
}

function linesTriangleAngles() {
  const a = rand(30, 80);
  const b = rand(30, 80);
  const answer = 180 - a - b;
  return makeQuestion(
    `В треугольнике два угла равны ${a}° и ${b}°. Найди третий угол.`,
    answer,
    [360 - a - b, 90 - a, 180 - a],
    `Сумма углов треугольника 180°: 180 − ${a} − ${b} = ${answer}°.`
  );
}

/* ---------- 4.3 Геометрия ---------- */
function geoArea(level) {
  const cap  = 4 + level * 4;
  const type = pick(['rect', 'tri', 'trap', 'par', 'rho', 'cir']);

  if (type === 'rect') {
    const a = rand(3, cap), b = rand(2, cap);
    return makeQuestion(
      `Площадь прямоугольника со сторонами ${a} и ${b}?`,
      a * b, [2 * (a + b), a + b, a * b / 2],
      `S = a·b = ${a}·${b} = ${a * b}.`
    );
  }
  if (type === 'tri') {
    const a = 2 * rand(2, cap), h = rand(3, cap);
    return makeQuestion(
      `Площадь треугольника с основанием ${a} и высотой ${h}?`,
      a * h / 2, [a * h, a + h, a * h / 3],
      `S = ½·a·h = ½·${a}·${h} = ${a * h / 2}.`
    );
  }
  if (type === 'trap') {
    const a = rand(3, cap);
    const b = a + 2 * rand(1, 3);
    const h = rand(2, cap);
    return makeQuestion(
      `Основания трапеции ${a} и ${b}, высота ${h}. Найди площадь.`,
      (a + b) * h / 2,
      [(a + b) * h, a * b * h / 2, (a + b) / 2],
      `S = ½(a + b)·h = ½·${a + b}·${h} = ${(a + b) * h / 2}.`
    );
  }
  if (type === 'par') {
    const a = rand(3, cap), h = rand(2, cap);
    return makeQuestion(
      `Сторона параллелограмма ${a}, высота к ней ${h}. Найди площадь.`,
      a * h, [a * h / 2, 2 * (a + h), a + h],
      `S = a·h = ${a * h}.`
    );
  }
  if (type === 'rho') {
    const d = 2 * rand(2, cap), e = rand(3, cap);
    return makeQuestion(
      `Диагонали ромба ${d} и ${e}. Найди площадь.`,
      d * e / 2, [d * e, d + e, d * e / 4],
      `S = ½·d₁·d₂ = ½·${d}·${e} = ${d * e / 2}.`
    );
  }
  // круг: r >= 3, чтобы не пересекались πr² и 2πr (r=2)
  const r    = rand(3, level * 3 + 2);
  const area = PI * r * r;
  return makeQuestion(
    `Площадь круга радиуса ${r} (π ≈ 3,14)?`,
    area,
    [2 * PI * r, PI * r, PI * r * r * 2],
    `S = πr² = 3,14·${r}² = ${fmtNum(area)}.`
  );
}

function geoVolume(level) {
  const cap  = 2 + level * 2;
  const type = pick(['cube', 'box', 'cyl', 'cone', 'pyr', 'sph', 'pri']);

  if (type === 'cube') {
    const a = rand(2, cap + 1);
    return makeQuestion(
      `Объём куба с ребром ${a}?`,
      a ** 3, [a * a * 6, a * a, 3 * a],
      `V = a³ = ${a}³ = ${a ** 3}.`
    );
  }
  if (type === 'box') {
    const a = rand(2, cap + 2), b = rand(2, cap + 2), c = rand(2, cap + 2);
    return makeQuestion(
      `Объём параллелепипеда ${a}×${b}×${c}?`,
      a * b * c,
      [2 * (a * b + b * c + a * c), a * b * c / 2, a + b + c],
      `V = a·b·c = ${a * b * c}.`
    );
  }
  if (type === 'cyl') {
    const r = rand(2, cap), h = rand(2, cap + 3);
    return makeQuestion(
      `Объём цилиндра: r = ${r}, h = ${h} (π ≈ 3,14).`,
      PI * r * r * h,
      [PI * r * r * h / 3, 2 * PI * r * h, PI * r * r],
      `V = πr²h = 3,14·${r}²·${h} = ${fmtNum(PI * r * r * h)}.`
    );
  }
  if (type === 'cone') {
    const r = rand(2, cap), h = 3 * rand(1, cap);
    return makeQuestion(
      `Объём конуса: r = ${r}, h = ${h} (π ≈ 3,14).`,
      PI * r * r * h / 3,
      [PI * r * r * h, PI * r * h / 3, PI * r * r * h * 2 / 3],
      `V = ⅓πr²h = ⅓·3,14·${r}²·${h} = ${fmtNum(PI * r * r * h / 3)}.`
    );
  }
  if (type === 'pyr') {
    const s = rand(4, cap * 4), h = 3 * rand(1, cap);
    return makeQuestion(
      `Площадь основания пирамиды ${s}, высота ${h}. Найди объём.`,
      s * h / 3, [s * h, s * h / 2, s + h],
      `V = ⅓·S·h = ⅓·${s}·${h} = ${s * h / 3}.`
    );
  }
  if (type === 'sph') {
    // r = 5 или 6 — избегаем совпадения 4πr² и πr³ (r=4) и 4πr² и V (r=3)
    const r = pick([5, 6]);
    const v = 4 / 3 * PI * r ** 3;
    return makeQuestion(
      `Объём шара радиуса ${r} (π ≈ 3,14)?`,
      v,
      [PI * r ** 3, 4 * PI * r * r, 4 / 3 * PI * r * r],
      `V = 4/3·πr³ = 4/3·3,14·${r}³ = ${fmtNum(v)}.`
    );
  }
  // призма
  const s = rand(3, cap * 3), h = rand(2, cap + 2);
  return makeQuestion(
    `Площадь основания призмы ${s}, высота ${h}. Найди объём.`,
    s * h, [s * h / 3, s + h, s * h / 2],
    `V = S·h = ${s * h}.`
  );
}

function geoSurface(level) {
  const cap  = 3 + level * 2;
  const type = pick(['cube', 'box', 'cyl']);

  if (type === 'cube') {
    const a = rand(2, cap + 2);
    return makeQuestion(
      `Площадь поверхности куба с ребром ${a}?`,
      6 * a * a, [4 * a * a, a ** 3, 12 * a],
      `S = 6a² = 6·${a}² = ${6 * a * a}.`
    );
  }
  if (type === 'box') {
    const a = rand(2, cap), b = rand(2, cap), c = rand(2, cap);
    const s = 2 * (a * b + b * c + a * c);
    return makeQuestion(
      `Площадь поверхности параллелепипеда ${a}×${b}×${c}?`,
      s,
      [a * b * c, s / 2, a * b + b * c + a * c + a],
      `S = 2(ab + bc + ac) = ${s}.`
    );
  }
  // цилиндр (боковая поверхность)
  const r = rand(2, cap), h = rand(2, cap + 2);
  const s = 2 * PI * r * h;
  return makeQuestion(
    `Площадь боковой поверхности цилиндра: r = ${r}, h = ${h} (π ≈ 3,14).`,
    s,
    [PI * r * h, 2 * PI * r * (r + h), PI * r * r * h],
    `Sбок = 2πrh = 2·3,14·${r}·${h} = ${fmtNum(s)}.`
  );
}

/* ---------- 4.4 Реестр тем ---------- */
const TOPICS = {
  trig: {
    name: 'Тригонометрия',
    icon: '📐',
    desc: 'sin, cos, tg, радианы',
    generators: [
      { minLevel: 1, fn: trigTable },
      { minLevel: 1, fn: trigRightTriangle },
      { minLevel: 1, fn: trigRadians },
      { minLevel: 2, fn: trigFromCos }
    ]
  },
  lines: {
    name: 'Свойства прямых',
    icon: '📏',
    desc: 'углы, k, пересечения',
    generators: [
      { minLevel: 1, fn: linesParallelAngles },
      { minLevel: 1, fn: linesSlope },
      { minLevel: 2, fn: linesParallelPerp },
      { minLevel: 2, fn: linesTriangleAngles },
      { minLevel: 3, fn: linesIntersection }
    ]
  },
  geo: {
    name: 'Объёмы и площади',
    icon: '🧊',
    desc: 'фигуры и тела',
    generators: [
      { minLevel: 1, fn: geoArea },
      { minLevel: 1, fn: geoVolume },
      { minLevel: 2, fn: geoSurface }
    ]
  }
};

function generateQuestion(topicKey, level) {
  const actualTopic = topicKey === 'mix'
    ? pick(Object.keys(TOPICS))
    : topicKey;
  const all       = TOPICS[actualTopic].generators;
  const available = all.filter(g => g.minLevel <= level);
  const pool      = available.length ? available : all;
  const gen       = pick(pool).fn;
  return { ...gen(level), topic: actualTopic };
}

async function doAuth() {
  const name  = $('#nm').value.trim();
  const group = $('#gr').value.trim();
  const pw    = $('#pw').value;
  const msg   = $('#msg');

  if (name.length < 2 || pw.length < 3) {
    msg.textContent = 'Ник от 2 символов, пароль от 3.';
    return;
  }

  msg.textContent = 'Проверяем…';
  const id     = 'u' + (await sha(name.toLowerCase())).slice(0, 20);
  const pwHash = await sha(pw + id);
  let user     = await getUser(id);

  if (user) {
    if (user.ph !== pwHash) {
      msg.textContent = '❌ Неверный пароль для этого ника.';
      return;
    }
    if (group && group !== user.g) {
      user.g = group;
      await putUser(user);
    }
  } else {
    user = {
      id, name, g: group, ph: pwHash,
      xp: 0, best: 0, games: 0, solved: 0, ok: 0, streak: 0, badges: []
    };
    await putUser(user);
  }

  me = user;
  LS.set(SESSION_KEY, id);
  startBoard();
  go('home');
}

function logout() {
  LS.set(SESSION_KEY, null);
  me = null;
  if (unsub) unsub();
  go('auth');
}

function rank() {
  const others = board.filter(x => x.id !== me.id);
  const sorted = [...others, me].sort((a, b) => b.xp - a.xp);
  return sorted.findIndex(x => x.id === me.id) + 1;
}

function levelName(xp) {
  if (xp < 100)  return 'Новичок';
  if (xp < 400)  return 'Ученик';
  if (xp < 1000) return 'Знаток';
  if (xp < 2000) return 'Мастер';
  return 'Гуру математики';
}

/* ---------- 6.3 Раунд ---------- */
function start(topicKey) {
  G = {
    topic: topicKey, level: selLevel,
    i: 0, xp: 0, streak: 0, maxStreak: 0, ok: 0,
    hint: false, done: false, timer: null, left: TIME_PER_Q
  };
  nextQuestion();
}

function tickTimer() {
  G.left -= 0.1;
  const bar = $('#tb');
  if (bar) bar.style.width = Math.max(0, G.left / TIME_PER_Q * 100) + '%';
  if (G.left <= 0) answer(-1);
}

function nextQuestion() {
  if (G.i >= ROUND_SIZE) { finishGame(); return; }
  clearInterval(G.timer);
  G.q    = generateQuestion(G.topic, G.level);
  G.i++;
  G.done = false;
  G.hint = false;
  G.left = TIME_PER_Q;
  go('play');
  G.timer = setInterval(tickTimer, 100);
}

function playScreen() {
  const q = G.q;
  app.innerHTML = `
    <div class="top">
      <button onclick="quitGame()">✕</button>
      <b>Вопрос ${G.i}/${ROUND_SIZE}</b>
      <span class="badge">⭐ ${G.xp} · 🔥 ${G.streak}</span>
    </div>
    <div class="card">
      <div class="bar"><i id="tb" style="width:${G.left / TIME_PER_Q * 100}%"></i></div>
      <div class="muted">${TOPICS[q.topic].icon} ${TOPICS[q.topic].name}</div>
      <p class="q">${esc(q.text)}</p>
      <div class="opts">
        ${q.options.map((o, i) => `
          <button id="o${i}" onclick="answer(${i})">${esc(o)}</button>`).join('')}
      </div>
      <div id="fb">
        <button id="hb" style="margin-top:12px;width:100%" onclick="useHint()">
          💡 Подсказка 50/50 (−5 XP)
        </button>
      </div>
    </div>`;
}

function useHint() {
  if (G.done || G.hint) return;
  G.hint = true;
  const wrongIdx = G.q.options
    .map((o, i) => i)
    .filter(i => G.q.options[i] !== G.q.answer);
  shuffle(wrongIdx).slice(0, 2).forEach(i => {
    const b = $('#o' + i);
    b.disabled = true;
    b.classList.add('off');
  });
  $('#hb').disabled = true;
}

function answer(selected) {
  if (G.done) return;
  G.done = true;
  clearInterval(G.timer);

  const q       = G.q;
  const correct = selected >= 0 && q.options[selected] === q.answer;

  if (correct) {
    G.ok++;
    G.streak++;
    G.maxStreak = Math.max(G.maxStreak, G.streak);
    const speedBonus  = Math.floor(Math.max(G.left, 0) / 5);
    const streakBonus = Math.min(G.streak, 5) * 2;
    const base        = 10 * G.level;
    const hintPenalty = G.hint ? 5 : 0;
    G.xp += Math.max(base + speedBonus + streakBonus - hintPenalty, 3);
  } else {
    G.streak = 0;
  }

  q.options.forEach((o, k) => {
    const b = $('#o' + k);
    b.disabled = true;
    if (o === q.answer)       b.classList.add('ok');
    else if (k === selected)  b.classList.add('bad');
    else                      b.classList.add('off');
  });

  const status    = correct ? '✅ Верно!' : selected < 0 ? '⏰ Время вышло.' : '❌ Не совсем.';
  const nextLabel = G.i >= ROUND_SIZE ? 'Результаты' : 'Дальше →';
  $('#fb').innerHTML = `
    <div class="ex">${status} ${esc(q.explanation)}</div>
    <button class="pri" style="margin-top:12px" onclick="nextQuestion()">${nextLabel}</button>`;
}

function quitGame() {
  clearInterval(G.timer);
  go('home');
}

async function finishGame() {
  clearInterval(G.timer);
  const u = me;
  u.badges = u.badges || [];

  u.xp     += G.xp;
  u.best    = Math.max(u.best || 0, G.xp);
  u.games++;
  u.solved += ROUND_SIZE;
  u.ok     += G.ok;
  u.t       = Date.now();

  const newBadges = [];
  const tryAdd = (cond, title) => {
    if (cond && !u.badges.includes(title)) {
      u.badges.push(title);
      newBadges.push(title);
    }
  };
  tryAdd(true,                    '🎓 Первая игра');
  tryAdd(G.ok === ROUND_SIZE,     '💯 Идеальный раунд');
  tryAdd(G.maxStreak >= 5,        '🔥 Серия ×5');
  tryAdd(u.xp >= 500,             '🚀 500 XP');
  tryAdd(u.games >= 10,           '🏅 10 игр');
  tryAdd(G.level === 3 && G.ok >= 8, '🧠 Хардкор');

  G.newBadges = newBadges;
  await putUser(u);
  go('result');
}

function showQR() {
  const url   = SHARE_URL || location.href;
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="card">
      <h2>Вход по QR</h2>
      <p class="muted">Наведи камеру телефона — откроется тренажёр</p>
      <div id="qr"></div>
      <p class="muted" style="word-break:break-all;font-size:12px">${esc(url)}</p>
      <div class="row">
        <button id="cp">📋 Копировать</button>
        <button onclick="this.closest('.modal').remove()">Закрыть</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  try {
    new QRCode($('#qr'), {
      text: url, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M
    });
  } catch (e) {
    $('#qr').textContent = 'QR недоступен — используй ссылку';
  }
  $('#cp').onclick = () => {
    try {
      navigator.clipboard.writeText(url);
      $('#cp').textContent = '✅ Готово';
    } catch (e) {}
  };
}

   ============================================================ */
(async function init() {
  const savedId = LS.get(SESSION_KEY, null);
  me = savedId ? (LS.get(SCORES_KEY, {})[savedId] || null) : null;

  if (me) { startBoard(); go('home'); }
  else    { go('auth'); }

  try {
    if (window.claude && claude.use) {
      db = await Promise.race([
        claude.use('db'),
        new Promise(resolve => setTimeout(() => resolve(null), 4000))
      ]);
      if (db) {
        mode = 'shared';
        if (savedId) {
          const fresh = await getUser(savedId);
          if (fresh) me = fresh;
        }
        if (me) startBoard();
        if (screen === 'auth' || screen === 'home') go(screen);
      }
    }
  } catch (e) {}
})();
